<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Aaron Ali Pazaran Hernandez">
    <title>Contact Us</title>
    <meta name="description"
      content="Get in touch with Z Rapid Trees: find us on the map, send us a message, and meet the team that will guide your next rafting trip.">
    <link rel="stylesheet" href="styles/rafting.css">


</head>

<body>
    <header>
        <div class="wrap header_inner">
            <a class="logo">
                <img src="images/z_rapids_trees.jpg" alt="Z Rapid Trees logo">
            </a>
            <nav class="site_nave">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="intro">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </div>

        <div class="contact_row">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3764.772710471003!2d-96.79165232478807!3d19.33566668192312!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85c4c9ba42fb503b%3A0x5dcb46800586506f!2sRio%20Antigua%20Rafting!5e0!3m2!1ses!2smx!4v1786027305375!5m2!1ses!2smx"
                  allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
                  title="Map showing Z Rapid Trees location"></iframe>
            </div>

            <form class="contact_form">
                <div class="form_group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>

                <div class="form_group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder">
                </div>

                <fieldset class="form_group">
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="purpose_general" name="purpose" value="general"
                          checked> General
                        Inquiry</label>
                    <label><input type="radio" id="purpose_reservation" name="purpose"
                          value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" id="purpose_suggestion" name="purpose"
                          value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <div class="form_group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>

                <div class="form_group checkbox_group">
                    <label><input type="checkbox" id="subscribe" name="subscribe"> Please Subscribe
                        me to the
                        monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team_gallery">
                <figure>
                    <img src="images/employee1.jpg"
                      alt="Photo of a Z Rapid Trees Rafting Operations Manager">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg"
                      alt="Photo of a Z Rapid Trees Logistics and Equipment Coordinator">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Photo of a Z Rapid Trees rafting guide">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap footer_inner">
            <p>©2026 Z Rapid Trees Aaron Pazaran</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook-square.svg" alt="Facebook Icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin-square.svg" alt="LinkedIn Icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram-square.svg" alt="Instagram Icon">
                </a>
            </nav>
        </div>
    </footer>


</body>

</html>
